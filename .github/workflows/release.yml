name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify plugin gates
        run: bash scripts/selftest.sh

      - name: Build compressed release archive
        run: node ./scripts/build-release.mjs ./dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/note-offload-v*.zip
            dist/note-offload-v*.zip.sha256
