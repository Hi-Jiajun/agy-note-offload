<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Offload</title>
  <script src="/preload.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-row">
        <div class="brand">
          <span class="live-dot" id="live-dot" title="自动刷新中"></span>
          <h1>Note Offload</h1>
        </div>
        <span class="meta-chip" id="top-summary">加载中</span>
      </div>
      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="workspaces">工作台</button>
        <button type="button" class="tab" data-tab="aliases">别名表</button>
        <button type="button" class="tab" data-tab="monitor">监控日志</button>
      </nav>
    </header>

    <div class="toast hidden" id="toast" role="status"></div>

    <main class="content">
      <!-- Tab 1: 工作台 -->
      <section class="panel active" id="panel-workspaces">
        <div id="ws-list-view">
          <div id="bound-banner" class="bound-banner hidden"></div>
          <div class="toolbar">
            <input id="ws-search" class="input" type="search" placeholder="筛选工作台或摘要" autocomplete="off">
            <button id="btn-toggle-create" type="button" class="btn primary">+ 新建</button>
            <button id="btn-clean-empty" type="button" class="btn secondary" title="删除 0 文件空目录">清空目录</button>
          </div>

          <form id="create-box" class="card form-card hidden">
            <div class="form-head">
              <strong>新建双向工作台</strong>
              <button id="btn-cancel-create" type="button" class="btn ghost sm">取消</button>
            </div>
            <input id="new-ws-name" class="input" type="text" placeholder="工作台短名（如 s6-emu-check）" required>
            <textarea id="new-ws-task" class="textarea sm" placeholder="可选：直接粘贴任务目标与待办（留空则生成标准模板）"></textarea>
            <div class="row-end">
              <button type="submit" class="btn primary">创建并复制启动词</button>
            </div>
          </form>

          <div id="ws-list" class="ws-list"></div>
        </div>

        <div id="ws-detail-view" class="hidden">
          <div class="detail-bar">
            <button id="btn-back" type="button" class="btn ghost sm">&lt;- 返回列表</button>
            <div class="detail-title-wrap">
              <strong id="detail-name"></strong>
              <span id="detail-health" class="badge"></span>
            </div>
          </div>

          <div class="action-strip">
            <button id="btn-copy-prompt" type="button" class="btn primary sm">复制启动词</button>
            <button id="btn-start-conv" type="button" class="btn secondary sm">新开会话接力</button>
            <button id="btn-open-editor" type="button" class="btn secondary sm">在文件栏打开</button>
            <button id="btn-jump-conv" type="button" class="btn ghost sm hidden">跳转绑定会话</button>
          </div>

          <div id="file-pills" class="file-pills"></div>

          <div class="file-bar">
            <span id="current-file-path" class="mono-path"></span>
            <div class="row-gap">
              <button id="btn-copy-path" type="button" class="btn ghost xs">复制路径</button>
              <button id="btn-toggle-edit" type="button" class="btn secondary xs hidden">编辑</button>
            </div>
          </div>

          <div id="file-viewer" class="file-viewer"></div>

          <div id="file-editor-wrap" class="hidden">
            <textarea id="file-editor" class="textarea code" spellcheck="false"></textarea>
            <div class="editor-foot">
              <span id="editor-hint" class="muted">支持 Ctrl+S 保存</span>
              <div class="row-gap">
                <button id="btn-cancel-edit" type="button" class="btn ghost sm">取消</button>
                <button id="btn-save-file" type="button" class="btn primary sm">保存写入</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Tab 2: 别名表 -->
      <section class="panel" id="panel-aliases">
        <div class="toolbar">
          <span class="muted">映射保存于 <code>~/.local/share/agy-note-offload/net-map.tsv</code></span>
          <button id="btn-toggle-reveal" type="button" class="btn secondary sm">显示真值</button>
        </div>

        <form id="alias-form" class="card form-card">
          <div class="grid-2">
            <input id="alias-key" class="input" type="text" placeholder="别名 (如 gw-a)" required>
            <input id="alias-note" class="input" type="text" placeholder="备注说明 (可选)">
          </div>
          <div class="row-gap">
            <input id="alias-val" class="input flex-1" type="text" placeholder="真实地址或主机 (如 https://host)" required>
            <button type="submit" class="btn primary sm">保存别名</button>
          </div>
        </form>

        <div id="alias-list" class="alias-list"></div>
      </section>

      <!-- Tab 3: 监控日志 -->
      <section class="panel" id="panel-monitor">
        <div class="section-head">
          <strong>活跃追踪会话</strong>
          <span class="muted">15 分钟窗口内状态</span>
        </div>
        <div id="session-list" class="session-list"></div>

        <div class="section-head">
          <strong>最近 Hook 调度日志</strong>
          <span class="muted">最新 40 条</span>
        </div>
        <pre id="log-box" class="log-box"></pre>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
